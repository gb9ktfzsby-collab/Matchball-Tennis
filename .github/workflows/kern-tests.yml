# Matchball Tennis - Kern-Tests bei jedem Push (reines C++, ohne Unreal)
#
# Prueft die Spiellogik (Ballphysik, Zaehlweise, Hawk-Eye, Challenge, Ablauf, Karriere) mit GCC und MSVC.
# Die Unreal-Automation-Tests laufen lokal ueber Unreal/Tools/test.ps1 (Unreal ist auf GitHub-Runnern nicht verfuegbar).

name: Kern-Tests

on:
  push:
    paths:
      - 'Unreal/Source/**'
      - 'Unreal/Data/**'
      - 'Unreal/Tools/KernTests/**'
      - 'Unreal/Tools/pruefe_daten.py'
      - 'Unreal/Tools/pruefe_karriere_daten.py'
      - '.github/workflows/kern-tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  kern-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Data-Tables pruefen (CSV-Spalten = Unreal-Strukturen)
        run: python Unreal/Tools/pruefe_daten.py
      - name: Karriere-Daten pruefen (Punkte, Preisgeld, Kalender, Anlagen)
        run: python Unreal/Tools/pruefe_karriere_daten.py
      - name: Konfigurieren
        run: cmake -S Unreal/Tools/KernTests -B Unreal/Tools/KernTests/build-ci -DCMAKE_BUILD_TYPE=Release
      - name: Bauen
        run: cmake --build Unreal/Tools/KernTests/build-ci --config Release
      - name: Testen
        run: ctest --test-dir Unreal/Tools/KernTests/build-ci -C Release -V
      # Unreal fasst mehrere .cpp zu einer Einheit zusammen (Unity-Build). Hier alle Kern- und Testquellen in
      # EINER Einheit: findet Namenskollisionen zwischen Dateien, die der normale Build nicht sieht.
      - name: Unity-Build (wie Unreal) konfigurieren
        run: cmake -S Unreal/Tools/KernTests -B Unreal/Tools/KernTests/build-unity -DCMAKE_BUILD_TYPE=Release -DCMAKE_UNITY_BUILD=ON -DCMAKE_UNITY_BUILD_BATCH_SIZE=0
      - name: Unity-Build bauen
        run: cmake --build Unreal/Tools/KernTests/build-unity --config Release
      - name: Unity-Build testen
        run: ctest --test-dir Unreal/Tools/KernTests/build-unity -C Release --output-on-failure
